<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Aileen Oyaneder</title>
  <meta name="description" content="Página no encontrada.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #170d14;
      --accent: #ff9ecb;
      --accent-dim: #e0559f;
      --accent-peach: #ffbcd9;
      --text: #f8eef4;
      --text-dim: #b8a0b0;
      --text-faint: #7f6579;
      --gradient: linear-gradient(135deg, #ff9ecb 0%, #ff6bab 50%, #e0559f 100%);
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 90% 60% at 50% 0%, rgba(224, 85, 159, 0.12), transparent 70%),
        linear-gradient(180deg, #1c1019 0%, #170d14 45%, #130b12 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .wrap { max-width: 560px; }
    .term {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-dim);
      background: rgba(255, 158, 203, 0.08);
      border: 1px solid rgba(255, 158, 203, 0.3);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 28px;
    }
    .term b { color: var(--accent); font-weight: 500; }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: clamp(5rem, 22vw, 9rem);
      line-height: 1;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }
    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      color: var(--accent-peach);
      font-weight: 500;
      margin-bottom: 14px;
    }
    p { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 34px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #1a0f17;
      background: var(--gradient);
      padding: 12px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 12px 30px -12px rgba(224, 85, 159, 0.6);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(224, 85, 159, 0.7); }
    .cursor { animation: blink 1s step-end infinite; color: var(--accent); }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="term"><b>$</b> cat ./ruta-buscada <span class="cursor">_</span><br><b>&gt;</b> error: no existe esa página</p>
    <div class="code">404</div>
    <h1>ruta no encontrada</h1>
    <p>La página que buscas no está (o ya se mudó). Pero mi portafolio sí existe:</p>
    <a class="btn" href="index.html">&larr; volver al inicio</a>
  </div>
</body>
</html>
